server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 129.225.76.84;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/icthospital/public;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://129.225.76.84$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 129.225.76.84;
    root /var/www/icthospital/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/shreeji-clinic-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shreeji-clinic-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTPS on;
    }

    location ~ /\.ht { deny all; }
}
